<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Ange KOUMBA Portfolio</title>
  <!-- ✅ Netlify Identity Widget (obligatoire pour login/register) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>
    // Charger Decap CMS après le DOM
    (function() {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@3.0.0/dist/decap-cms.js';
      script.onload = function() {
        // Enregistrement des prévisualisations (optionnel)
        if (window.CMS && window.CMS.registerPreviewTemplate) {
          window.CMS.registerPreviewTemplate("projects", (data) => {
            return `<h1>${data.title}</h1><p>${data.description}</p>`;
          });
        }
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
