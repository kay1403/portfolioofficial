[build]
  command = "npm run netlify"
  publish = "."

[build.environment]
  NODE_VERSION = "18"

# Redirection pour l’interface d’administration
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Servir les fichiers JSON avec le bon type MIME
[[headers]]
  for = "/content/*.json"
  [headers.values]
    Content-Type = "application/json"

# Headers pour JS/CSS (inchangé)
[[headers]]
  for = "/dist/js/*"
  [headers.values]
    Content-Type = "application/javascript"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/dist/css/*"
  [headers.values]
    Content-Type = "text/css"
    X-Content-Type-Options = "nosniff"